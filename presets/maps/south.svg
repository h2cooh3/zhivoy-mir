<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Georgia, 'Times New Roman', serif">
 <defs>
  <filter id="paper" x="0" y="0" width="100%" height="100%">
   <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" seed="7" result="n"/>
   <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.43  0 0 0 0 0.25  0 0 0 0.35 0" result="tint"/>
   <feComposite in="tint" in2="SourceGraphic" operator="in" result="stain"/>
   <feBlend in="SourceGraphic" in2="stain" mode="multiply"/>
  </filter>
  <filter id="rough"><feTurbulence type="turbulence" baseFrequency="0.04" numOctaves="2" seed="3" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="3"/></filter>
  <pattern id="waves" width="46" height="18" patternUnits="userSpaceOnUse"><path d="M2 10 q6 -6 12 0 t12 0" fill="none" stroke="#6d6248" stroke-width="1" opacity=".45"/></pattern>
  <pattern id="field" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(28)"><line x1="0" y1="0" x2="0" y2="10" stroke="#7a6a45" stroke-width="1" opacity=".55"/></pattern>
  <pattern id="field2" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><line x1="0" y1="0" x2="0" y2="10" stroke="#7a6a45" stroke-width="1" opacity=".45"/></pattern>
  <g id="tree"><circle cx="-4" cy="0" r="6" fill="#6a7a3a" opacity=".9"/><circle cx="4" cy="-1" r="6.5" fill="#6f8040" opacity=".9"/><circle cx="0" cy="-5" r="6" fill="#7c8c48" opacity=".9"/><line x1="0" y1="5" x2="0" y2="11" stroke="#4a3a28" stroke-width="1.4"/></g><g id="cyp"><path d="M0 -16 C5 -8 4 6 0 10 C-4 6 -5 -8 0 -16 Z" fill="#3f5a2c"/></g>
  <g id="tree2"><circle cx="0" cy="-3" r="7" fill="#6a6340" opacity=".8"/><line x1="0" y1="4" x2="0" y2="10" stroke="#4a3a28" stroke-width="1.4"/></g>
  <g id="house"><path d="M-6 0 L0 -6 L6 0 Z" fill="#4a3a28"/><rect x="-5" y="0" width="10" height="7" fill="#d9c79e" stroke="#4a3a28" stroke-width="1.2"/></g>
  <g id="rock"><path d="M-9 4 L-5 -6 L2 -8 L8 -2 L9 5 Z" fill="#3b352b" stroke="#2a251e" stroke-width="1"/></g>
 </defs>
