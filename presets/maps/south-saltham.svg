<g fill="#3d2f1f" font-style="italic"><text x="330" y="160" font-size="17" text-anchor="middle" opacity="0.8" letter-spacing="2">опушка Глухолесья</text><text x="860" y="385" font-size="30" text-anchor="middle" opacity="1" letter-spacing="0">Солтхэм</text><text x="840" y="505" font-size="13" text-anchor="middle" opacity="1" letter-spacing="0">рынок</text><text x="905" y="628" font-size="14" text-anchor="middle" opacity="1" letter-spacing="0">«Якорь»</text><text x="662" y="424" font-size="11" text-anchor="middle" opacity="0.9" letter-spacing="0">кладбище</text><text x="700" y="495" font-size="12" text-anchor="middle" opacity="1" letter-spacing="0">часовня</text><text x="1000" y="850" font-size="14" text-anchor="middle" opacity="1" letter-spacing="0">пристань</text><text x="440" y="670" font-size="17" text-anchor="middle" opacity="1" letter-spacing="0">Рыбацкая бухта</text><text x="494" y="544" font-size="10" text-anchor="middle" opacity="0.8" letter-spacing="0">сети</text><text x="185" y="880" font-size="20" text-anchor="middle" opacity="1" letter-spacing="0">Чёрные камни</text><text x="428" y="230" font-size="14" text-anchor="middle" opacity="1" letter-spacing="0" transform="rotate(80 428 230)">Тихий ручей</text><text x="1430" y="230" font-size="16" text-anchor="middle" opacity="1" letter-spacing="0" transform="rotate(80 1430 230)">р. Брин</text><text x="1440" y="335" font-size="13" text-anchor="middle" opacity="1" letter-spacing="0">мельница</text><text x="1520" y="215" font-size="12" text-anchor="middle" opacity="1" letter-spacing="0">пасека</text><text x="900" y="280" font-size="17" text-anchor="middle" opacity="0.9" letter-spacing="0">Длинные полосы</text><text x="1540" y="535" font-size="13" text-anchor="end" opacity="1" letter-spacing="0">к Вороньей крепости →</text><text x="40" y="640" font-size="12" text-anchor="start" opacity="1" letter-spacing="0">← к Лисьей бухте</text><text x="918" y="160" font-size="13" text-anchor="start" opacity="1" letter-spacing="0">↑ на юг, через лес — в Эшфорд</text><text x="800" y="960" font-size="38" text-anchor="middle" opacity="0.5" letter-spacing="12">СЕРОЕ МОРЕ</text></g>
